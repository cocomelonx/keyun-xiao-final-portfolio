<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Website &amp; UI/UX — Keyun Xiao</title>
<meta name="description" content="Website and UI/UX product work by Keyun Xiao.">
<style>
/* same paper, rules and type as the photography page; here the work runs as a
   single column — one piece of media per row, read top to bottom */
:root{
  --paper:#e8ece8;
  --ink:#17201e;
  --muted:#7b8a81;
  --rule:#cfd6d0;
  --sans:Arial,Helvetica,sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0;padding:0 2.2vw;background:var(--paper);color:var(--ink);
  font:13px/1.35 var(--sans);min-height:100svh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ---- bars (identical to photography.html) ---- */
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:30px 0}
.bar--top{--topbar-h:84px;height:var(--topbar-h);padding:0;align-items:center;border-bottom:1px solid var(--rule)}
.bar--foot{margin-top:auto;padding-bottom:30px;border-top:1px solid var(--rule);color:var(--muted)}
.wordmark{display:inline-flex;align-items:center}
.wordmark img{height:calc(var(--topbar-h) * .55);width:auto;display:block;transition:opacity .15s ease;transform-origin:50% 50%}
.wordmark img.is-spinning{animation:logo-spin 1.15s cubic-bezier(.45,.05,.2,1)}
@keyframes logo-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wordmark:hover img,.wordmark:focus-visible img{opacity:.55}
.bar nav{display:flex;gap:22px;font:11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.bar nav .here{color:var(--muted)}
.folio{font:10px/1.4 'Courier New',monospace;letter-spacing:.08em}
.back{font:11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.back:hover{color:var(--ink)}

/* ---- page head ---- */
main{padding:44px 0 56px}

/* ---- the work: video and board stacked flush as one section ---- */
.work{display:flex;flex-direction:column;gap:10px;padding:0 0 10px}
.media{display:block;width:100%;background:#fff;overflow:hidden}
.media img,.media video{display:block;width:100%;height:auto}
/* the case-study board is very tall — it scrolls inside its own frame
   so one row stays one row */
.media--board{max-height:86svh;overflow-y:auto;overscroll-behavior:contain;cursor:zoom-in}
.media--board.is-open{max-height:none;cursor:zoom-out}
.note{
  margin:16px 0 0;font:13px/1.5 var(--sans);color:var(--muted);max-width:62ch;
}
.expand{
  margin-top:4px;align-self:flex-start;border:0;background:none;padding:0;color:var(--ink);cursor:pointer;
  font:11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  border-bottom:1px solid var(--rule);padding-bottom:3px;
}
.expand:hover{border-bottom-color:var(--ink)}
.expand:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

@media(max-width:860px){
  body{padding:0 5vw}
  .bar{padding:22px 0}
  .bar--top{--topbar-h:62px;padding:0}
  main{padding:30px 0 40px}
  .media--board{max-height:70svh}
}
@media(prefers-reduced-motion:reduce){
  .wordmark img.is-spinning{animation:none}
}
</style>
</head>
<body>

<header class="bar bar--top">
  <a class="wordmark" href="index.html" data-cursor="home"><img src="marks/logo.png" alt="Keyun Xiao"></a>
  <nav><span class="here">Website &amp; UI/UX</span><a href="photography.html">Photography</a><a href="index.html">Index</a></nav>
</header>

<main>

  <section class="work">

    <div class="media">
      <video poster="work/vors-walkthrough-poster.webp"
             autoplay muted loop playsinline controls preload="auto"
             aria-label="Screen recording walking through the VORS rug store interface">
        <source src="work/vors-walkthrough.mp4" type="video/mp4">
        <source src="work/vors-walkthrough.webm" type="video/webm">
      </video>
    </div>

    <div class="media media--board" id="board" data-cursor="expand">
      <img src="work/vors-store.webp" srcset="work/vors-store.webp 2048w, work/vors-store@2x.webp 4096w" sizes="100vw" alt="VORS rug store screens: home page with an oversized wordmark, a sale shelf, a gift card block, mobile views, the catalog grid, and the Blinchik the Cat product page." loading="lazy" decoding="async">
    </div>
    <button class="expand" id="expand" aria-expanded="false" aria-controls="board">Expand full board ↓</button>

    <div class="media">
      <video poster="work/vors-giftcard-poster.webp"
             autoplay muted loop playsinline controls preload="metadata"
             aria-label="Screen recording of the VORS mobile product screens and the gift card">
        <source src="work/vors-giftcard.mp4" type="video/mp4">
        <source src="work/vors-giftcard.webm" type="video/webm">
      </video>
    </div>

    <div class="media media--board" id="board2" data-cursor="expand">
      <img src="work/vors-checkout.webp" srcset="work/vors-checkout.webp 2048w, work/vors-checkout@2x.webp 4096w" sizes="100vw" alt="VORS checkout page with order summary, the catalog with the bag drawer open, and the store shown across tablet and phone mockups." loading="lazy" decoding="async">
    </div>
    <button class="expand" id="expand2" aria-expanded="false" aria-controls="board2">Expand full board ↓</button>

    <div class="media media--board" id="board3" data-cursor="expand">
      <img src="work/vors-collections.webp" srcset="work/vors-collections.webp 2048w, work/vors-collections@2x.webp 4096w" sizes="100vw" alt="VORS collections page with an oversized headline and a carousel of the designers and artists behind each collection." loading="lazy" decoding="async">
    </div>
    <button class="expand" id="expand3" aria-expanded="false" aria-controls="board3">Expand full board ↓</button>

  </section>

</main>

<footer class="bar bar--foot">
  <span class="folio">PERSONAL UNIVERSE · VOL. 001</span>
  <a class="back" href="index.html">← Index</a>
</footer>

<script>
/* the walkthrough plays by itself, muted and looping; browsers that hold the
   first play() until the element is on screen get a nudge from the observer,
   and it idles whenever it is scrolled away */
(function () {
  var vids = document.querySelectorAll('.work video');
  if (!vids.length) return;
  vids.forEach(function (v) {
    v.muted = true;                     // belt and braces: autoplay needs it
    var tryPlay = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    tryPlay();
    if (!('IntersectionObserver' in window)) return;
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) tryPlay();
        else if (!v.paused) v.pause();
      });
    }, { threshold: .25 }).observe(v);
  });
})();

/* each tall board starts clipped to one screen; a click (or its button) lets it
   run at full height instead of scrolling inside itself */
(function () {
  [['board','expand'],['board2','expand2'],['board3','expand3']].forEach(function (pair) {
    var board = document.getElementById(pair[0]);
    var btn = document.getElementById(pair[1]);
    if (!board || !btn) return;
    function toggle(){
      var open = board.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Collapse board \u2191' : 'Expand full board \u2193';
      if (!open) board.scrollIntoView({block:'start', behavior:'smooth'});
    }
    btn.addEventListener('click', toggle);
    board.addEventListener('click', toggle);
  });
})();

/* one full clockwise turn when the logo is hovered, always allowed to finish */
(function () {
  var mark = document.querySelector('.wordmark img');
  if (!mark) return;
  mark.parentElement.addEventListener('pointerenter', function () {
    if (!mark.classList.contains('is-spinning')) mark.classList.add('is-spinning');
  });
  mark.addEventListener('animationend', function () { mark.classList.remove('is-spinning'); });
})();
</script>
<script src="cursor.js"></script>
</body>
</html>
